services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-groot}
      POSTGRES_USER: ${POSTGRES_USER:-groot_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    volumes:
      - groot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-groot_dev} -d ${POSTGRES_DB:-groot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://groot_dev:local_dev_only_change_me@db:5432/groot}
    command: ["python", "-m", "app.migrations", "upgrade"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://groot_dev:local_dev_only_change_me@db:5432/groot}
      APP_ENV: ${APP_ENV:-development}
      WEATHER_MODE: ${WEATHER_MODE:-disabled}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s

volumes:
  groot_db:
