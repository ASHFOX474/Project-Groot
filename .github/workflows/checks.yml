name: Checks

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: python3 -B scripts/check_repo.py

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-api.sh
      - run: sh scripts/check-db.sh

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sh scripts/check-mobile.sh
        working-directory: .

  demo-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - run: sh scripts/db.sh check
      - run: sh scripts/db.sh seed-demo
      - run: python3 scripts/smoke_api.py
      - if: always()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down
